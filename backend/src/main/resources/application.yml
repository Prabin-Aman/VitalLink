# All settings come from environment variables. Locally they're read from backend/.env too
# (see .env.example). Nothing secret lives in this file.
spring:
  application:
    name: vitallink-api
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    format:
      date: iso
      date-time: iso
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    # Everything lives in the private schema, including Flyway's own history table (docs/06 §6.2).
    schemas: vitallink
    default-schema: vitallink
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true

  mail:
    # Mailpit (docker compose) locally; set SMTP_* for a real provider.
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

vitallink:
  env: ${ENV:local}
  # Where links in email point (the web portal), the sender address, and Google sign-in's OAuth client id.
  web-url: ${WEB_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:VitalLink <no-reply@vitallink.local>}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  # Google Health (Fitbit, Pixel Watch): the same OAuth client as sign-in, plus its secret. CONNECTION_KEY
  # (32 bytes, base64) seals the stored refresh tokens; local/test derive one from DEV_JWT_SECRET.
  google-health:
    client-id: ${GOOGLE_HEALTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_HEALTH_CLIENT_SECRET:}
  connection-key: ${CONNECTION_KEY:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  supabase-url: ${SUPABASE_URL:}
  jwt-audience: authenticated
  dev-jwt-secret: ${DEV_JWT_SECRET:}

server:
  # Render sets PORT; locally the API listens on 8000 like before.
  port: ${PORT:8000}
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{request_id:-}] "
