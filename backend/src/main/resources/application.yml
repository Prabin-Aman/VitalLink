# All settings come from environment variables. Locally they're read from backend/.env too
# (see .env.example). Nothing secret lives in this file.
spring:
  application:
    name: vitallink-api
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    format:
      date: iso
      date-time: iso
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    # Everything lives in the private schema, including Flyway's own history table (docs/06 §6.2).
    schemas: vitallink
    default-schema: vitallink
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true

vitallink:
  env: ${ENV:local}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  supabase-url: ${SUPABASE_URL:}
  jwt-audience: authenticated
  dev-jwt-secret: ${DEV_JWT_SECRET:}

server:
  # Render sets PORT; locally the API listens on 8000 like before.
  port: ${PORT:8000}
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{request_id:-}] "
