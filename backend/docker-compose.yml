# Local Postgres and a mail catcher for development. Values come from backend/.env (see .env.example).
#   docker compose up -d      start in the background
#   docker compose down       stop (data is kept in the pgdata volume)
#   docker compose down -v    stop and wipe the data
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      # Bound to localhost only, so the database isn't reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit catches the API's email (password reset links) locally: open http://localhost:8025 to read it.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"   # SMTP the API sends to
      - "127.0.0.1:8025:8025"   # web inbox

volumes:
  pgdata:
