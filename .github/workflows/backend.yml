# Backend CI: lint, migrations and tests on a real Postgres, plus an image build.
# Nothing merges to main unless this passes (docs/08-operations-and-testing.md §8.3).
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitallink
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vitallink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitallink -d vitallink"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://vitallink:ci-only-password@localhost:5432/vitallink
      REQUIRE_DB: "1"  # in CI a missing database is a failure, not a skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply, roll back and re-apply
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the Render image
        run: docker build -t vitallink-api backend
