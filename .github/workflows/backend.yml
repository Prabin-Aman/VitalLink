# Backend CI: formatting, the full test suite on a real Postgres, coverage, and an image build.
# Nothing merges to main unless this passes (docs/08-operations-and-testing.md §8.3).
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "packages/api/src/openapi.gen.ts", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "packages/api/src/openapi.gen.ts", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitallink
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vitallink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitallink -d vitallink"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      # The tests use <db>_test next to this database, created and migrated from scratch on every run.
      DATABASE_URL: postgresql://vitallink:ci-only-password@localhost:5432/vitallink
      DEV_JWT_SECRET: ci-only-dev-secret-0123456789abcdef0123456789
      REQUIRE_DB: "1" # in CI a missing database is a failure, not a skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Formatting
        run: ./mvnw -B -q spotless:check
      - name: Tests (unit, API, database, guardrails) and coverage
        run: ./mvnw -B verify
      - name: System test (the packaged jar over real HTTP)
        env:
          JOB_SECRET: ci-only-job-secret
          PORT: "8000"
        run: |
          java -jar target/vitallink-api.jar > target/system-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/ready && break; sleep 2; done
          ./mvnw -B -q exec:java -Dexec.mainClass=com.vitallink.api.tools.SystemCheck -Dexec.args="http://localhost:8000"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend types match the API (packages/api/src/openapi.gen.ts; run `npm run api:types`)
        run: |
          npx --yes openapi-typescript@7.13.0 http://localhost:8000/openapi.json -o ../packages/api/src/openapi.gen.ts
          git diff --exit-code -- ../packages/api/src/openapi.gen.ts
      - name: Keep the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Render image
        run: docker build -t vitallink-api backend
