# Android helper app (Health Connect): unit tests and a debug APK, uploaded as a build artifact to download and
# install on a phone. The runner already has the Android SDK; Gradle comes from setup-gradle (no wrapper jar in git).
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests (buckets, upload body)
        run: gradle -p android testDebugUnitTest
      - name: Build the debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vitallink-sync-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
