# Android helper app (Health Connect): unit tests and a debug APK, uploaded as a build artifact to download and
# install on a phone. The runner already has the Android SDK; Gradle comes from setup-gradle (no wrapper jar in git).
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Errors are also written as annotations, which anyone can read through the API without signing in.
      - name: Unit tests (buckets, upload body) and the debug APK
        run: |
          set -o pipefail
          if ! gradle -p android testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log; then
            grep -E -A4 '^e: |error:|FAILED|What went wrong|Could not|Dependency |requires ' build.log | grep -v '^--' | head -80 | while IFS= read -r line; do
              echo "::error title=android build::${line//%/%25}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vitallink-sync-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # On main, the APK replaces the one on the "android-latest" release, so the web portal can link to a fixed
  # public URL: https://github.com/zeutonx/VitalLink/releases/download/android-latest/vitallink-sync.apk
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vitallink-sync-debug
      - name: Publish to the android-latest release
        run: |
          mv app-debug.apk vitallink-sync.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "VitalLink Sync (Android)" --prerelease --target "$GITHUB_SHA" --notes "The Android helper app that sends Health Connect data to VitalLink. Install the APK on the phone, then link it with a code from Settings › Connected Devices › Add a device › Android phone. Rebuilt on every change to android/."
          gh release upload android-latest vitallink-sync.apk --clobber
