# Weekly backup (docs/08 §8.4): pg_dump of the private schema, encrypted with AES-256 before it leaves
# the runner, kept as a workflow artifact for 90 days. The repository must be private.
#
# Repository secrets: DATABASE_URL (Supabase session pooler, postgresql://…) and BACKUP_PASSPHRASE.
# Restore: download the artifact, then
#   gpg --batch --decrypt --passphrase "$BACKUP_PASSPHRASE" vitallink.dump.gpg > vitallink.dump
#   pg_restore --no-owner --dbname "$TARGET_URL" vitallink.dump
name: backup

on:
  schedule:
    - cron: "30 8 * * 0" # Sundays 08:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" && test -n "$BACKUP_PASSPHRASE"
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --schema=vitallink --format=custom --no-owner' > vitallink.dump
          test -s vitallink.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            --output vitallink.dump.gpg vitallink.dump
          shred -u vitallink.dump
      - uses: actions/upload-artifact@v4
        with:
          name: vitallink-backup-${{ github.run_number }}
          path: vitallink.dump.gpg
          retention-days: 90
