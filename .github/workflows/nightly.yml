# The nightly job (docs/08 §8.4): goal achievements, missed doses, tomorrow's appointments, overdue
# devices, refills, and retention cleanup. Runs at 09:00 UTC (3–4 AM in Dallas). Safe to re-run: every
# notification has a dedupe key.
#
# Repository secrets: API_URL (e.g. https://vitallink-api.onrender.com) and JOB_SECRET (same as on Render).
name: nightly

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the API (Render free instances sleep) and run the job
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          curl --fail --silent --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 "$API_URL/ready"
          curl --fail --show-error --silent --max-time 600 -X POST \
            -H "X-Job-Secret: $JOB_SECRET" "$API_URL/internal/jobs/nightly"
